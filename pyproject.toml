[project]
name = "crystra-evolution"
version = "0.1.0"
description = "Stateless Metric Result service for Crystra"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "firestige" }]
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
]

[project.scripts]
crystra-evolution = "crystra_evolution.runtime:main"

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["crystra_evolution"]

[tool.uv]
required-version = ">=0.11.28,<0.12"
