name: Evolution CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read exact Contract dependency
        id: contract
        run: |
          echo "repository=$(jq -er .repository config/development-contract.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision config/development-contract.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ steps.contract.outputs.revision }}
          path: .crystra-inputs/contracts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm --prefix .crystra-inputs/contracts/workflow-dsl-2-candidate ci --ignore-scripts

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q tests/unit

  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read exact Contract dependency
        id: contract
        run: |
          echo "repository=$(jq -er .repository config/development-contract.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision config/development-contract.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ steps.contract.outputs.revision }}
          path: .crystra-inputs/contracts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm --prefix .crystra-inputs/contracts/workflow-dsl-2-candidate ci --ignore-scripts

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"
      - run: uv sync --locked
      - run: make check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read exact Contract dependency
        id: contract
        run: |
          echo "repository=$(jq -er .repository config/development-contract.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision config/development-contract.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.contract.outputs.repository }}
          ref: ${{ steps.contract.outputs.revision }}
          path: .crystra-inputs/contracts
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t crystra-evolution-ci .
